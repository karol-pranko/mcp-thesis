[project]
name = "mcp-master-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karol Sygiet", email = "01201850@pw.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.31.0",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mcp>=2.2.0",
    "networkx>=3.2",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rank-bm25>=0.2.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sqlglot>=30.21.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
mcp-master-thesis = "mcp_master_thesis:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
